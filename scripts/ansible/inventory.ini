# ==============================================================================
# OpenBao HA 集群 Inventory
# 由 deploy-ansible.sh 自动生成, 也可手动编辑
#
# 用法:
#   ansible-playbook -i inventory.ini deploy.yml -K
#
# 注意: ansible_host 必须是节点的实际 IP 或主机名
# ==============================================================================

[openbao_cluster]
# 格式: 节点别名 ansible_host=IP openbao_node_id=nodeN
# 第一个节点被视为初始 Leader
node1 ansible_host=10.0.1.11
node2 ansible_host=10.0.1.12
node3 ansible_host=10.0.1.13

[openbao_cluster:vars]
# SSH 连接配置 (所有节点共用)
ansible_user=sfxadmin
ansible_port=22
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

# 如果使用 SSH 密钥认证 (推荐), 取消注释并设置路径:
# ansible_ssh_private_key_file=~/.ssh/id_rsa

# 如果使用密码认证, 运行 playbook 时加 -k 参数 (SSH 密码)
# 如果使用 sudo, 运行 playbook 时加 -K 参数 (sudo 密码, 只需输入一次)
